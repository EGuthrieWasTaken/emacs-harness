# Local development / CI convenience wrapper around the single image
# (DESIGN.md §5.1). The supported unRAID deployment is the plain
# container; this exists so `docker compose up` works on a laptop.
services:
  emacs-harness:
    build:
      context: .
      dockerfile: container/Dockerfile
    image: emacs-harness:dev
    container_name: emacs-harness
    command: ["server"]
    ports:
      - "6080:6080"
      - "8080:8080"
    environment:
      # HTTP API (DESIGN §6.1, §14 phase 4), off unless enabled; the MCP
      # server in mcp-server/ is the intended client. Uncomment and set
      # real values, or override via `docker compose run -e ...`.
      # EH_HTTP_ENABLE: "1"
      # EH_HTTP_CLIENT_ID: "dev-client-id"
      # EH_HTTP_CLIENT_SECRET: "dev-client-secret"
    volumes:
      - ./runs:/var/lib/eh/runs
    shm_size: "1gb"
